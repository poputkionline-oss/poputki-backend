name: Production Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Run Maintenance Tick
    runs-on: ubuntu-latest

    steps:
      - name: Execute Maintenance Tick
        run: |
          set -e
          echo "Triggering production maintenance tick on Render..."

          RESPONSE=$(curl --fail --silent --show-error \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST "https://poputki-backend-9dv6.onrender.com/api/admin/maintenance/tick" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_SECRET_TOKEN }}")

          echo "Response summary:"
          echo "$RESPONSE" | jq .

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // empty')
          EXPIRE_SUCCESS=$(echo "$RESPONSE" | jq -r '.tasks.expire_pending.success // empty')
          AUTO_SUCCESS=$(echo "$RESPONSE" | jq -r '.tasks.auto_complete.success // empty')

          if [ "$SUCCESS" != "true" ] || [ "$EXPIRE_SUCCESS" != "true" ] || [ "$AUTO_SUCCESS" != "true" ]; then
            echo "::error::Maintenance tick reported failure: success=$SUCCESS, expire_pending=$EXPIRE_SUCCESS, auto_complete=$AUTO_SUCCESS"
            exit 1
          fi

          echo "Production maintenance tick completed successfully."

      - name: Execute Acquisition Funnel Sweep (outbox drain + reconciliation)
        run: |
          set -e
          echo "Triggering production acquisition-funnel maintenance sweep on Render..."

          RESPONSE=$(curl --fail --silent --show-error \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST "https://poputki-backend-9dv6.onrender.com/api/admin/maintenance/acquisition-sweep" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_SECRET_TOKEN }}")

          echo "Response summary:"
          echo "$RESPONSE" | jq .

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // empty')
          OUTBOX_SUCCESS=$(echo "$RESPONSE" | jq -r '.tasks.outbox_sweep.success // empty')
          RECON_SUCCESS=$(echo "$RESPONSE" | jq -r '.tasks.reconciliation.success // empty')
          RECON_SKIPPED=$(echo "$RESPONSE" | jq -r '.tasks.reconciliation.skipped // false')

          if [ "$SUCCESS" != "true" ] || [ "$OUTBOX_SUCCESS" != "true" ] || [ "$RECON_SUCCESS" != "true" ]; then
            echo "::error::Acquisition sweep reported failure: success=$SUCCESS, outbox_sweep=$OUTBOX_SUCCESS, reconciliation=$RECON_SUCCESS"
            exit 1
          fi

          if [ "$RECON_SKIPPED" = "true" ]; then
            echo "Reconciliation was skipped this run (lock held by an overlapping run) — expected occasionally, not an error."
          fi

          echo "Production acquisition-funnel sweep completed successfully."
